# /etc/nginx/sites-available/auction-search
# Reverse proxy for the Node app running on 127.0.0.1:3000 (see deploy/auction-search.service)

server {
    listen 80;
    server_name your-domain.example.com;

    # Redirect to HTTPS once certbot has issued a certificate:
    # return 301 https://$host$request_uri;

    client_max_body_size 50m; # allow CSV uploads
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After running `sudo certbot --nginx -d your-domain.example.com`, certbot will
# add a matching `listen 443 ssl;` server block automatically.
